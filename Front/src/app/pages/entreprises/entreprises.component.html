<app-navbar></app-navbar>
<div class="container my-5">
  
  <!-- Section de Titre Professionnel -->
  <div class="text-center mb-5">
    <h2 class="display-4 text-primary fw-bold">Our Trusted Partner Enterprises</h2>
    <p class="lead text-muted">Explore the trusted companies that help us deliver outstanding services.</p>
  </div>

  <!-- Carrousel d'images ou bannière -->
  <div id="enterpriseCarousel" class="carousel slide mb-5" data-bs-ride="carousel">
    <div class="carousel-inner">
      <div class="carousel-item active">
        <img src="https://cdnen.africanmanager.com/wp-content/uploads/2018/05/telnet.jpg" class="d-block w-100" alt="Company 1">
      </div>
      <div class="carousel-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/thumb/c/c8/Orange_logo.svg/2048px-Orange_logo.svg.png" class="d-block w-100" alt="Company 2">
      </div>
      <div class="carousel-item">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/9a/Linedata_Logo.jpg" class="d-block w-100" alt="Company 3">
      </div>
    </div>
    <button class="carousel-control-prev" type="button" data-bs-target="#enterpriseCarousel" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Previous</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#enterpriseCarousel" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Next</span>
    </button>
  </div>

  <!-- Tableau des Entreprises -->
  <div class="card shadow-lg mb-4">
    <div class="card-header bg-gradient-dark text-white">
      <h5 class="mb-0">Partner Enterprises Information</h5>
    </div>
    <div class="card-body">
      <table class="table table-bordered table-hover">
        <thead class="thead-dark">
          <tr>
            <th scope="col">#</th>
            <th scope="col">Enterprise Name</th>
            <th scope="col">Email</th>
            <th scope="col">Address</th>
            <th scope="col">Téléphone</th>
            <th scope="col">Actions</th>

          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let entreprise of entreprises; let i = index">
            <td>{{ i + 1 }}</td>
            <td>{{ entreprise.nom}}</td>
            <td>{{ entreprise.email }}</td>
            <td>{{ entreprise.adresse }}</td>
            <td>{{ entreprise.telephone}}</td>

            <td>
              <button class="btn btn-outline-warning btn-sm" (click)="editEntreprise(entreprise)">
                <i class="fas fa-edit"></i> Edit
              </button>
              <button class="btn btn-outline-danger btn-sm" (click)="deleteEntreprise(entreprise)">
                <i class="fas fa-trash-alt"></i> Delete
              </button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
  
  
</div>
