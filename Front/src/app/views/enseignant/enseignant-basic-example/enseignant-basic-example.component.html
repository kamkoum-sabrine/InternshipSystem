<div class="d-flex justify-content-end mb-3 ">
    <button class="btn  text-white me-5 mt-4" style="background-color: #669bbc ;" (click)="openDialog()">
        <i class="fas fa-plus-circle me-2"></i>
        Ajouter un enseignant
    </button>

</div>

<c-smart-table *ngIf="Enseignants && Enseignants.length > 0" [activePage]="1" [columns]="columns" [columnFilter]="true"
    [itemsPerPageSelect]="true" [itemsPerPage]="10" [items]="Enseignants"
    [sorterValue]="{ column: 'name', state: 'asc' }" [tableProps]="{ hover: true, striped: true, responsive: true }"
    [tableBodyProps]="{ align: 'middle' }" clickableRows header pagination>


    <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
        <td>


            <!-- Pour les autres colonnes, afficher la valeur par défaut -->
            <ng-container *ngIf="columnName !== 'action'">
                {{ item[columnName] }}
            </ng-container>

            <!-- Pour la colonne 'Action', afficher les boutons de suppression et de modification -->
            <ng-container *ngIf="columnName === 'actions'">
                <button cButton color="info" size="sm" style="background-color: #003049 ;" class="me-2"
                    (click)="openDialogUpdate(item.id)">
                    <i class="fa fa-edit" style="color: #ffffff;"></i> <!-- Icon for edit -->
                </button>
                <button cButton class="ms-1" color="danger" size="sm" style="background-color: #780000 ;"
                    (click)="supprimerEnseignant(item.id)">
                    <i class="fa fa-trash" style="color: #ffffff;"></i> <!-- Icon for delete -->
                </button>
            </ng-container>



        </td>
    </ng-template>



</c-smart-table>
