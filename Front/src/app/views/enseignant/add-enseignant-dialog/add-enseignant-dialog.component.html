<c-row>
    <c-col xs="12">
        <c-card class="mb-4">
            <c-card-header ngPreserveWhitespaces>
                <strong>Création d'un enseignant</strong>
            </c-card-header>
            <c-card-body>
                <form [formGroup]="enseignantForm" (ngSubmit)="onSubmit()" cForm>

                    <!-- Name Field -->
                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="nom">Nom</label>
                        <c-col sm="10">
                            <input formControlName="nom" id="nom" type="text" cFormControl
                                placeholder="Nom de l'enseignant" />
                            <div *ngIf="enseignantForm.get('nom')?.invalid && (enseignantForm.get('nom')?.dirty || enseignantForm.get('nom')?.touched)"
                                class="text-danger">
                                <div *ngIf="enseignantForm.get('nom')?.errors?.['required']">Le nom est requis.</div>
                                <div *ngIf="enseignantForm.get('nom')?.errors?.['minlength']">Le nom doit contenir au
                                    moins 2 caractères.</div>
                            </div>
                        </c-col>
                    </c-row>

                    <!-- Prenom Field -->
                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="prenom">Prénom</label>
                        <c-col sm="10">
                            <input formControlName="prenom" cFormControl id="prenom" type="text"
                                placeholder="Prénom de l'enseignant" />
                            <div *ngIf="enseignantForm.get('prenom')?.invalid && (enseignantForm.get('prenom')?.dirty || enseignantForm.get('prenom')?.touched)"
                                class="text-danger">
                                <div *ngIf="enseignantForm.get('prenom')?.errors?.['required']">Le prénom est requis.
                                </div>
                                <div *ngIf="enseignantForm.get('prenom')?.errors?.['minlength']">Le prénom doit contenir
                                    au moins 2 caractères.</div>
                            </div>
                        </c-col>
                    </c-row>

                    <!-- Email Field -->
                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" cFormControl for="email">Email</label>
                        <c-col sm="10">
                            <input formControlName="email" id="email" cFormControl type="text"
                                placeholder="Email de l'enseignant" />
                            <div *ngIf="enseignantForm.get('email')?.invalid && (enseignantForm.get('email')?.dirty || enseignantForm.get('email')?.touched)"
                                class="text-danger">
                                <div *ngIf="enseignantForm.get('email')?.errors?.['required']">L'email est requis.</div>
                                <div *ngIf="enseignantForm.get('email')?.errors?.['email']">L'email doit être valide.
                                </div>
                            </div>
                            <div *ngIf="emailExistant" class="text-danger">
                                Cet email est déjà utilisé.
                            </div>
                        </c-col>
                    </c-row>

                    <!-- Action Buttons -->
                    <c-row class="mb-3">
                        <c-col sm="12" class="d-flex justify-content-end">
                            <button cButton class="me-3" color="danger" type="button" style="color: #ffffff;"
                                (click)="onNoClick()">Annuler</button>
                            <button cButton color="info" style="color: #ffffff;" type="submit"
                                [disabled]="enseignantForm.invalid">Soumettre</button>
                        </c-col>
                    </c-row>

                </form>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
