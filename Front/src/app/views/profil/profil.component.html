<c-row>
    <c-col xs="12">
        <c-card class="mb-4">
            <c-card-header>
                <strong>Modification du profil</strong>
            </c-card-header>
            <c-card-body>
                <form (ngSubmit)="onSubmit()" cForm>

                    <!-- Section Photo -->
                    <c-row class="mb-3">
                        <c-col sm="10">
                            <div class="position-relative d-inline-block">
                                <img [src]="user.photo || 'src/assets/images/avatars/6.jpg'"
                                    class="rounded-circle avatar-xl">
                                <label for="avatarUpload" class="avatar-edit">
                                    <c-icon name="cil-pencil"></c-icon>
                                    <input id="avatarUpload" type="file" (change)="onFileSelected($event)"
                                        accept="image/*" class="d-none">
                                </label>
                            </div>
                            <small class="text-muted d-block mt-2">Formats: JPG, PNG, GIF - Max 2MB</small>
                        </c-col>
                    </c-row>

                    <!-- Informations Personnelles -->
                    <h5 class="mb-3 border-bottom pb-2">Informations Personnelles</h5>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="nom">Nom</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.nom" name="nom" cFormControl id="nom" required>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="prenom">Prénom</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.prenom" name="prenom" cFormControl id="prenom" required>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="cin">CIN</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.cin" name="cin" cFormControl id="cin" pattern="[0-9]{8}"
                                title="8 chiffres requis">
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="sexe">Sexe</label>
                        <c-col sm="10">
                            <select [(ngModel)]="user.sexe" name="sexe" cFormControl id="sexe">
                                <option value="">Sélectionner...</option>
                                <option *ngFor="let f of sexeoptions" [value]="f">{{ f }}</option>
                            </select>
                        </c-col>
                    </c-row>
                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="date">Date</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.dateDeNaissance" name="date" cFormControl id="date" type="date"
                                required />
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="lieuNaissance">Lieu de naissance</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.lieuNaissance" name="lieuNaissance" cFormControl
                                id="lieuNaissance">
                        </c-col>
                    </c-row>

                    <!-- Coordonnées -->
                    <h5 class="mb-3 border-bottom pb-2 mt-4">Coordonnées</h5>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="email">Email</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.email" name="email" cFormControl id="email" type="email" required>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="tel">Téléphone</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.tel" name="tel" cFormControl id="tel" type="tel"
                                pattern="[0-9]{8,15}">
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="adresse">Adresse</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.adresse" name="adresse" cFormControl id="adresse">
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="fax">Fax</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.fax" name="fax" cFormControl id="fax" pattern="[0-9]+">
                        </c-col>
                    </c-row>

                    <!-- Informations Académiques -->
                    <h5 class="mb-3 border-bottom pb-2 mt-4">Informations Académiques</h5>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="filiere">Filière</label>
                        <c-col sm="10">
                            <select [(ngModel)]="user.filiere" name="filiere" cFormControl id="filiere">
                                <option value="">Sélectionner...</option>
                                <option *ngFor="let f of filiereOptions" [value]="f">{{ f }}</option>
                            </select>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="niveau">Niveau</label>
                        <c-col sm="10">
                            <select [(ngModel)]="user.niveau" name="niveau" cFormControl id="niveau">
                                <option value="">Sélectionner...</option>
                                <option *ngFor="let n of niveauOptions" [value]="n">{{ n }}</option>
                            </select>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="formation">Formation</label>
                        <c-col sm="10">
                            <select [(ngModel)]="user.formation" name="formation" cFormControl id="formation">
                                <option value="">Sélectionner...</option>
                                <option *ngFor="let f of formationOptions" [value]="f">{{ f }}</option>
                            </select>
                        </c-col>
                    </c-row>

                    <c-row class="mb-3">
                        <label cLabel class="col-sm-2 col-form-label" for="option">Option</label>
                        <c-col sm="10">
                            <input [(ngModel)]="user.option" name="option" cFormControl id="option">
                        </c-col>
                    </c-row>

                    <!-- Boutons -->
                    <c-row class="mt-4">
                        <c-col sm="12" class="d-flex justify-content-end">
                            <button cButton color="secondary" class="me-2" type="button"
                                (click)="onCancel()">Annuler</button>
                            <button cButton color="primary" type=" submit">Enregistrer</button>
                        </c-col>
                    </c-row>
                </form>
            </c-card-body>
        </c-card>
    </c-col>
</c-row>
