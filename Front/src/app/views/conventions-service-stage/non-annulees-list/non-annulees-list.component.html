<div class="card">
    <div class="card-header">
      <h5>Conventions non annulées</h5>
    </div>
    <div class="card-body">
      @if (isLoading) {
        <div class="text-center py-4">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Chargement...</span>
          </div>
        </div>
      } @else {
        <app-non-annulees-table [conventions]="conventions" />
      }
    </div>
  </div>
