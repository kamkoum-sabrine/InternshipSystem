<c-row>
  <c-col xs="12">
    <c-card class="mb-4">
      <c-card-header ngPreserveWhitespaces>
        <div class="d-flex justify-content-between align-items-center">
          <div>
            <strong>Gestion des Conventions</strong> <small>Service de Stage</small>
          </div>
          <button 
  cButton 
  color="primary" 
  size="sm"
  routerLink="/conventionsService/non-annulees"
  (click)="handleNavigationClick()"
  #navButton
>
  <i class="cil-list me-2"></i>
  Voir conventions non annulées
</button>
        </div>
      </c-card-header>
      <c-card-body>
        <app-smart-table-convention [conventions]="conventions" />
      </c-card-body>
    </c-card>
  </c-col>
</c-row>
