<div class="d-flex justify-content-end mb-3 ">
  <button class="btn btn-success text-white me-5 mt-4" (click)="openDialog()">
    Ajouter une soutenance
  </button>
</div>

<c-smart-table *ngIf="soutenances && soutenances.length > 0" [activePage]="1" [columnSorter]="true" [columns]="columns"
  [columnFilter]="true" [itemsPerPageSelect]="true" [itemsPerPage]="10" [items]="soutenances"
  [sorterValue]="{ column: 'name', state: 'asc' }" [tableProps]="{ hover: true, striped: true, responsive: true }"
  [tableBodyProps]="{ align: 'middle' }" clickableRows header pagination>


  <ng-template cTemplateId="tableData" let-columnName="columnName" let-item="item" let-tdContent="tdContent">
    <td>


      <!-- Vérifier si la colonne est 'encadrant' et afficher son nom -->
      <ng-container *ngIf="columnName === 'encadrant'">
        {{ item.encadrant?.nom }} {{ item.encadrant?.prenom }}
        <!-- Accéder au nom de l'encadrant -->
      </ng-container>
      <ng-container *ngIf="columnName === 'etudiant'">
        {{ item.etudiant?.nom }} {{ item.etudiant?.prenom }}
        <!-- Accéder au nom de l'encadrant -->
      </ng-container>

      <!-- Pour les autres colonnes, afficher la valeur par défaut -->
      <ng-container *ngIf="columnName !== 'encadrant' && columnName !== 'action' && columnName !== 'etudiant'">
        {{ item[columnName] }}
      </ng-container>

      <!-- Pour la colonne 'Action', afficher les boutons de suppression et de modification -->
      <ng-container *ngIf="columnName === 'action'">
        <button cButton class="me-2 btn-warning" size="sm" (click)="AfficherJury(item.id)" style="color: #ffffff;">
          Jury
        </button>
        <button cButton class="me-2" color="info" size="sm" (click)="openDialogUpdate(item.id)">
          <i class="fa fa-edit" style="color: #ffffff;"></i> <!-- Icon for edit -->
        </button>
        <button cButton class="ms-1" color="danger" size="sm" (click)="supprimerSoutenance(item.id)">
          <i class="fa fa-trash" style="color: #ffffff;"></i> <!-- Icon for delete -->
        </button>
      </ng-container>



    </td>
  </ng-template>



</c-smart-table>
